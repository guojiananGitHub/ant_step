name: 刷步数

on:
  schedule:
    # UTC: 北京时间每天 08:17、14:17、20:17，避开整点高峰；GitHub 可能延迟。
    - cron: '17 0,6,12 * * *'
  workflow_dispatch:

# 手动运行和定时运行串行执行，避免同时写回 token。
concurrency:
  group: ant-step-token-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
          # 等待并发锁后读取最新 token，避免使用排队前的旧提交。
          ref: master
          fetch-depth: 0
      - name: 记录触发时间
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "event=$TRIGGER_EVENT schedule=$TRIGGER_SCHEDULE"
          TZ=UTC date '+UTC: %Y-%m-%d %H:%M:%S'
          TZ=Asia/Shanghai date '+北京时间: %Y-%m-%d %H:%M:%S'

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          python3 -m pip install --retries 5 --timeout 60 -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          if [ ! -f encrypted_tokens.data ]; then
            echo "没有 token 文件，跳过保存"
            exit 0
          fi
          git add -- encrypted_tokens.data
          if git diff --cached --quiet; then
            echo "token 没有变化，跳过提交"
            exit 0
          fi
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          # 合并运行期间的其他提交；冲突时保留失败信号，不强制覆盖远端。
          git pull --rebase origin master
          git push origin HEAD:master
